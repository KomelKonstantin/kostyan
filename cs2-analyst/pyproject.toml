[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cs2-analyst"
version = "0.1.0"
description = "CLI: вероятности исходов матчей CS2 по данным HLTV и сравнение с коэффициентами"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["requests>=2.28", "beautifulsoup4>=4.11"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
cs2-analyst = "cs2_analyst.cli:main"

[tool.setuptools]
packages = ["cs2_analyst"]
